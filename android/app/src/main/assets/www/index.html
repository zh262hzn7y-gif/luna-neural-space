<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota dos Parceiros</title>
<style>
:root{--bg:#07060e;--card:#16122b;--line:#34295a;--fg:#f3f0ff;--muted:#b3a8d6;--v:#8d6bff;--c:#49e0ff;--e:#3ee0a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px 6px}
h1{font-size:22px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
main{flex:1;overflow:auto;padding:0 16px 12px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.clock{font-size:48px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
button,input,select{font:inherit;color:inherit}
button{min-height:48px;border:0;border-radius:12px;background:var(--v);color:#f7f4ff;font-weight:700}
button:disabled{opacity:.38}
.ghost{background:#221b3d;color:var(--fg)}
.good{background:var(--e);color:#06281c}
.nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;border-top:1px solid var(--line);background:#0c1020;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:transparent;color:var(--muted);border-radius:0;font-size:12px;min-height:56px}
.nav button.on{color:var(--c)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
input,select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#0c1020;padding:0 10px}
.msg{background:#221b3d;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tabs button{background:#221b3d;color:var(--muted);min-height:40px}
.tabs button.on{background:var(--v);color:#f7f4ff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{min-height:40px;background:#221b3d;font-size:12px;position:relative;padding-bottom:8px}
.cal button.on{background:var(--v);color:#f7f4ff}
.cal button.has::after{content:"";position:absolute;left:22%;right:22%;bottom:4px;height:3px;border-radius:2px;background:var(--c)}
.news{display:block;background:#221b3d;border-radius:12px;padding:10px;margin-top:8px;color:inherit;text-decoration:none}
.bubble{position:fixed;right:16px;bottom:78px;z-index:6;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9af6ff,#8d6bff 55%,#1a1033)}
.menu{position:fixed;right:16px;bottom:150px;z-index:6;display:flex;flex-direction:column;gap:6px}
.split{display:grid;gap:10px}
@media(min-width:800px){
  .split{grid-template-columns:1.15fr .85fr;align-items:start}
  .clock{font-size:64px}
  main{padding-top:8px}
}
@media(max-height:520px){
  header{padding:6px 12px}
  .clock{font-size:32px}
  button{min-height:42px}
}
</style>
</head>
<body>
<header>
  <div>
    <p class="muted" id="hello">Rota dos Parceiros</p>
    <h1 id="who">Motorista</h1>
    <p class="muted" id="sub">Gestão neste aparelho</p>
  </div>
  <button class="ghost" id="gear" style="width:48px" aria-label="Configurações">⚙</button>
</header>
<main id="view"></main>
<nav class="nav" id="nav"></nav>
<script>
const BUILD=630;
const KEY="rota_apk_v6";
const CATS=["Combustível","Alimentação","Pedágio","Estacionamento","Manutenção","Lavagem","Seguro","Outros"];
const APPS=["Uber","99","inDrive","Particular","Gorjeta","Outros"];
const CUSTOM_KEY="rota_custom_cats_v1";
function loadCustom(){try{return JSON.parse(localStorage.getItem(CUSTOM_KEY))||{earn:[],spend:[]}}catch(e){return{earn:[],spend:[]}}}
function saveCustom(c){localStorage.setItem(CUSTOM_KEY,JSON.stringify(c))}
function allEarnCats(){const c=loadCustom();return APPS.concat(c.earn.filter(x=>!APPS.includes(x)))}
function allSpendCats(){const c=loadCustom();return CATS.concat(c.spend.filter(x=>!CATS.includes(x)))}
function addCustomCat(kind,name){
  name=(name||"").trim(); if(!name) return false;
  const c=loadCustom(); const list=kind==="earn"?c.earn:c.spend; const all=kind==="earn"?allEarnCats():allSpendCats();
  if(all.includes(name)) return false;
  list.push(name); saveCustom(c); return true;
}
const $=id=>document.getElementById(id);
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function money(c){return (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function clock(ms){const s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")}
function hm(ts){return new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function estado(s){return s==="working"?"trabalhando":s==="paused"?"pausado":s==="coffee"?"café":s==="closed"?"fechado":"livre"}
function frozen(){const day=dayKey(new Date()); return [...state.shifts].reverse().find(s=>s.day===day&&s.state==="closed"&&s.seal==="same")||null}
function midnightOf(day){const p=day.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]+1).getTime()}
function rollMidnight(now){
  const today=dayKey(new Date(now));
  state.shifts.forEach(s=>{
    if(s.day>=today) return;
    if(s.state==="working"||s.state==="paused"||s.state==="coffee"){
      if(s.state==="working"&&s.segment){const gap=now-s.seen; if(gap>=0&&gap<=2*3600e3){const until=Math.min(midnightOf(s.day),now); if(until>s.segment) s.worked+=until-s.segment}}
      s.state="closed"; s.segment=null; s.ended=midnightOf(s.day)-1; s.seen=now; s.seal="next"; s.note="A meia-noite encerrou este turno. Horas depois do dia não foram somadas.";
    } else if(s.seal==="same") s.seal="next";
  });
}
function empty(){return {name:"",copilot:"Luna",tab:"inicio",gsub:"jornada",shifts:[],entries:[],plan:{day:0,month:0,basis:"liquido"},track:false,chat:[{role:"luna",text:"Pode escrever ou usar o microfone. Texto não sai em voz."}]}}
let state; try{state=JSON.parse(localStorage.getItem(KEY))||empty()}catch(e){state=empty()}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function save(){persist(); render()}
function active(){return state.shifts.find(s=>s.state==="working"||s.state==="paused"||s.state==="coffee")}
function worked(s,now){if(s.state==="working"&&s.segment){const x=now-s.segment; if(x>0&&x<2*3600e3) return s.worked+x} return s.worked}
function catchUp(now){
  rollMidnight(now);
  const s=active(); if(!s||s.state!=="working") return;
  const d=now-s.seen;
  if(d<0||d>2*3600e3){s.state="paused"; s.segment=null; s.note="Intervalo longo ou relógio alterado. Não somei essas horas. Use Retomar ou Zerar."; s.seen=now; return}
  s.worked+=d; s.segment=now; s.seen=now;
}
function start(now){
  if(active()) return "Já existe turno aberto. Use Retomar ou Zerar.";
  const fr=frozen(); if(fr) return "O turno "+fr.slot+" está congelado. Use Retomar. Não abri outro.";
  const day=dayKey(new Date(now));
  const n=state.shifts.filter(s=>s.day===day).length+1;
  if(n>4) return "Os quatro turnos de hoje já foram usados. Não existe quinto turno.";
  state.shifts.push({id:String(now),day,slot:n,state:"working",started:now,ended:null,worked:0,segment:now,seen:now,pauses:[],coffee:[],km:0,note:"",seal:null});
  return "Turno "+n+" iniciado às "+hm(now)+".";
}
function pause(now){const s=active(); if(!s) return "Nenhum turno aberto."; if(s.state!=="working") return "O turno já está parado."; const x=now-s.segment; if(x>0&&x<2*3600e3) s.worked+=x; s.segment=null; s.state="paused"; s.pauses.push([now,null]); s.seen=now; return "Pausa registrada."}
function cafe(now){const s=active(); if(!s) return "Abra um turno antes do café."; if(s.state==="coffee") return "O café já está em andamento."; if(s.state==="working"){const x=now-s.segment; if(x>0&&x<2*3600e3) s.worked+=x; s.segment=null} s.state="coffee"; s.coffee.push([now,null]); s.seen=now; return "Café separado da pausa."}
function resume(now){
  const s=active();
  if(!s){const fr=frozen(); if(!fr) return "Nada para retomar."; fr.state="working"; fr.ended=null; fr.segment=now; fr.seen=now; fr.seal=null; fr.note=""; return "Turno "+fr.slot+" retomado com "+clock(fr.worked)+" já acumulados."}
  if(s.state==="working") return "Já está trabalhando.";
  const list=s.state==="coffee"?s.coffee:s.pauses; const last=list[list.length-1]; if(last&&!last[1]) last[1]=now;
  s.state="working"; s.segment=now; s.seen=now; s.note=""; return "Retomado. O início continua "+hm(s.started)+".";
}
function sealShift(s,now,kind){if(s.state==="working"){const x=now-s.segment; if(x>0&&x<2*3600e3) s.worked+=x} s.segment=null; s.state="closed"; s.ended=now; s.seen=now; s.seal=kind}
function closeShift(now){const s=active(); if(!s) return "Nenhum turno aberto."; const kind=s.slot>=4?"same":"next"; sealShift(s,now,kind); return kind==="same"?"Turno 4 fechado. Não existe turno 5. Retomar continua nele. Trabalhado "+clock(s.worked)+".":"Turno "+s.slot+" fechado. O próximo Iniciar abre o turno "+(s.slot+1)+". Trabalhado "+clock(s.worked)+"."}
function conclude(now){const s=active(); if(!s) return "Não há turno para concluir."; sealShift(s,now,"same"); return "Turno "+s.slot+" concluído e congelado. Retomar continua neste mesmo turno."}
function zerar(now){const s=active()||frozen(); if(!s) return "Não há turno aberto para zerar."; s.state="working"; s.started=now; s.ended=null; s.worked=0; s.segment=now; s.seen=now; s.pauses=[]; s.coffee=[]; s.seal=null; s.note=""; return "Turno "+s.slot+" zerado. O financeiro do dia não foi apagado."}
function totals(days,now){
  const inc=state.entries.filter(e=>e.kind==="in"&&days.includes(e.day)).reduce((a,e)=>a+e.cents,0);
  const exp=state.entries.filter(e=>e.kind==="out"&&days.includes(e.day)).reduce((a,e)=>a+e.cents,0);
  const shifts=state.shifts.filter(s=>days.includes(s.day));
  const ms=shifts.reduce((a,s)=>a+worked(s,now),0);
  const km=shifts.reduce((a,s)=>a+(s.km||0),0);
  const h=ms/36e5;
  return {inc,exp,net:inc-exp,ms,km,ph:h>=1/60?Math.round(inc/h):null,nph:h>=1/60?Math.round((inc-exp)/h):null};
}
function monthDays(now){const d=new Date(now); const y=d.getFullYear(), m=d.getMonth(), n=new Date(y,m+1,0).getDate(); const out=[]; for(let i=1;i<=n;i++) out.push(dayKey(new Date(y,m,i))); return out}
function intent(text,now){
  const n=text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/zerar|comecar de novo/.test(n)) return zerar(now);
  if(/iniciar|comecar/.test(n)) return start(now);
  if(/pausar|pausa/.test(n)) return pause(now);
  if(/cafe/.test(n)) return cafe(now);
  if(/retomar|continuar/.test(n)) return resume(now);
  if(/concluir/.test(n)) return conclude(now);
  if(/fechar|encerrar/.test(n)) return closeShift(now);
  if(/quanto tempo|trabalhei/.test(n)){const t=totals([dayKey(new Date(now))],now); return "Hoje: "+clock(t.ms)+" trabalhadas."}
  if(/quanto ganhei|lucro|resultado/.test(n)){const t=totals([dayKey(new Date(now))],now); return "Hoje bruto "+money(t.inc)+", despesas "+money(t.exp)+", líquido "+money(t.net)+"."}
  const m=n.match(/(\d+[.,]?\d*)/);
  if(/registre|anota|lanca/.test(n)){
    if(!m) return "Diga o valor em reais e a categoria.";
    const cents=Math.round(Number(m[1].replace(",","."))*100);
    const cat=CATS.find(c=>n.includes(c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").slice(0,6)));
    const app=APPS.find(a=>n.includes(a.toLowerCase()));
    if(!cat && !app) return "Falta a categoria ou o aplicativo. Exemplo: 20 reais de combustível.";
    state.entries.push({id:String(now),kind:cat?"out":"in",cents,day:dayKey(new Date(now)),cat:cat||"Corrida",app:app||"",note:"Luna"});
    return "Lancei "+money(cents)+(cat?" em "+cat:" na "+(app||"corrida"))+".";
  }
  return "";
}
function shiftButtons(open){
  const fr=frozen();
  const dis=on=>on?"":" disabled";
  return `<div class="acts">
    <button data-act="start"${dis(!open&&!fr)}>Iniciar</button>
    <button class="ghost" data-act="pause"${dis(open&&open.state==="working")}>Pausar</button>
    <button class="ghost" data-act="cafe"${dis(open&&open.state!=="coffee")}>Café</button>
    <button class="${(open&&open.state!=="working")||fr?"good":""}" data-act="resume"${dis((open&&open.state!=="working")||fr)}>Retomar</button>
    <button class="ghost" data-act="close"${dis(!!open)}>Fechar turno</button>
    <button class="ghost" data-act="done"${dis(!!open)}>Concluir</button>
    <button class="ghost" data-act="zero"${dis(!!open||!!fr)}>Zerar</button>
  </div><p class="muted" id="note"></p>`;
}
function doAct(name){
  const now=Date.now();
  let msg="";
  if(name==="start") msg=start(now);
  if(name==="pause") msg=pause(now);
  if(name==="cafe") msg=cafe(now);
  if(name==="resume") msg=resume(now);
  if(name==="close"){ if(!confirm("Fechar este turno? O próximo Iniciar abre o seguinte. No quarto, Retomar continua nele.")) return; msg=closeShift(now) }
  if(name==="done"){ if(!confirm("Concluir e congelar este turno? Retomar continua nele.")) return; msg=conclude(now) }
  if(name==="zero"){ if(!confirm("Zerar este turno? Ganhos e despesas ficam.")) return; msg=zerar(now) }
  save();
  const note=$("note"); if(note) note.textContent=msg;
}
let tab=state.tab||"inicio";
let gsub=state.gsub||"jornada";
function setTab(t){tab=t; state.tab=t; save()}
const NAV=[["inicio","Início"],["radio","Rádio"],["comunidade","Comunidade"],["config","Configuração"]];
const ALIAS={gestao:"config",mapa:"radio",fala:"radio",luna:"inicio",comunicacao:"comunidade"};
if(ALIAS[tab]) tab=ALIAS[tab];
function render(){
  const now=Date.now(); catchUp(now);
  const h=new Date().getHours();
  $("hello").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite");
  $("who").textContent=state.name||"Motorista";
  const open=active();
  $("sub").textContent=open?("Turno "+open.slot+" · "+estado(open.state)):"Nenhum turno aberto";
  $("nav").innerHTML=NAV.map(([id,label])=>`<button class="${tab===id?"on":""}" data-tab="${id}">${label}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  const day=dayKey(new Date());
  const t=totals([day],now);
  if(tab==="inicio"){
    $("view").innerHTML=`<div class="split">
      <section class="card"><p class="muted">Jornada</p><div class="clock" id="clock">${open?clock(worked(open,now)):clock(t.ms)}</div>
        <p class="muted">${open?"Turno "+open.slot+" · "+estado(open.state)+" · início "+hm(open.started):"Nenhum turno aberto. São quatro turnos por dia."}</p>
        ${open&&open.note?`<p class="muted">${open.note}</p>`:""}
        ${shiftButtons(open)}
      </section>
      <div>
        <div class="grid">
          <div class="card"><p class="muted">Bruto</p><b>${money(t.inc)}</b></div>
          <div class="card"><p class="muted">Despesas</p><b>${money(t.exp)}</b></div>
          <div class="card"><p class="muted">Líquido</p><b>${money(t.net)}</b></div>
          <div class="card"><p class="muted">Líquido por hora</p><b>${t.nph==null?"Sem dados":money(t.nph)}</b></div>
        </div>
        <section class="card" id="clima" style="margin-top:10px"><p class="muted">Clima · Governador Valadares</p><p>Consultando Open-Meteo…</p></section>
        <section class="card" style="margin-top:10px"><p class="muted">Notícias</p>
          <p><a href="https://www.driododoce.com.br/" style="color:var(--c)">Diário do Rio Doce</a></p>
          <p><a href="https://news.google.com/search?q=BR-381+Governador+Valadares&hl=pt-BR&gl=BR&ceid=BR:pt-419" style="color:var(--c)">BR-381 nas fontes</a></p>
          <div id="newsbox"><p class="muted">Buscando fontes…</p></div>
          <p><a href="https://www.driododoce.com.br/" style="color:var(--c)">Diário do Rio Doce</a></p>
          <p><a href="https://news.google.com/search?q=Governador+Valadares&hl=pt-BR&gl=BR&ceid=BR:pt-419" style="color:var(--c)">Valadares na fonte</a></p>
          <p><a href="https://news.google.com/search?q=BR-381+Governador+Valadares&hl=pt-BR&gl=BR&ceid=BR:pt-419" style="color:var(--c)">BR-381 na fonte</a></p>
          <p class="muted">Sem manchete inventada.</p>
        </section>
        <section class="card" style="margin-top:10px" id="calbox"></section>
        <section class="card" style="margin-top:10px"><b>${state.copilot||"Luna"}</b><p class="muted">${state.name?state.name+", ":""}escreva um comando da jornada.</p>
          <div id="chat"></div>
          <div class="row"><input id="q" placeholder="Iniciar, pausar, concluir, 20 reais de combustível"><button id="mic">Falar</button><button id="send">Enviar</button></div>
        </section>
      </div>
    </div>`;
    fetch("https://api.open-meteo.com/v1/forecast?latitude=-18.851&longitude=-41.949&current=temperature_2m,weather_code&timezone=America/Sao_Paulo")
      .then(r=>r.json()).then(b=>{
        const box=$("clima"); if(!box) return;
        const names={0:"Céu limpo",1:"Quase limpo",2:"Parcial",3:"Nublado",61:"Chuva",63:"Chuva",80:"Pancadas",95:"Trovoada"};
        const code=b.current&&b.current.weather_code;
        const temp=b.current&&typeof b.current.temperature_2m==="number"?Math.round(b.current.temperature_2m)+"°C":"—";
        box.innerHTML=`<p class="muted">Clima · Open-Meteo</p><b style="font-size:28px">${temp}</b><p class="muted">${names[code]||"Condição na fonte"} · ${(b.current&&b.current.time||"").replace("T"," ")}</p>`;
      }).catch(()=>{ const box=$("clima"); if(box) box.innerHTML="<p class='muted'>Clima indisponível agora.</p>" });
  } else if(tab==="config"){
    const subs=[["jornada","Jornada"],["dinheiro","Financeiro"],["plano","Plano"],["cal","Calendário"],["rel","Relatório"]];
    const md=monthDays(now); const mt=totals(md,now);
    let body="";
    if(gsub==="jornada"){
      const today=state.shifts.filter(s=>s.day===day);
      body=`<section class="card"><p class="muted">${open?"Turno "+open.slot+" · "+estado(open.state):"Sem turno"}</p><div class="clock" id="clock">${open?clock(worked(open,now)):"00:00:00"}</div>${shiftButtons(open)}
        <p class="muted">Pausa e café não entram no tempo trabalhado. Quatro turnos por dia.</p></section>
        <section class="card" style="margin-top:10px">${today.map(s=>`<p>Turno ${s.slot} · ${estado(s.state)} · ${clock(worked(s,now))}</p>`).join("")||"<p class='muted'>Nada lançado hoje.</p>"}</section>`;
    } else if(gsub==="dinheiro"){
      body=`<section class="card"><p class="muted">Hoje ${money(t.net)} líquido</p>
        <div class="row"><button class="ghost" id="kin">Receita</button><button class="ghost" id="kout">Despesa</button></div>
        <label>Valor em reais</label><input id="val" inputmode="decimal" placeholder="0,00">
        <label>Aplicativo ou categoria</label><select id="cat">${APPS.map(a=>`<option>${a}</option>`).join("")}${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
        <button id="add" style="margin-top:8px;width:100%">Lançar</button>
        <div id="list"></div></section>`;
    } else if(gsub==="plano"){
      const goal=Math.round((state.plan.month||0)*100); const pct=goal?Math.round(mt.net/goal*100):0;
      body=`<section class="card"><p class="muted">Meta do mês</p><p>${money(mt.net)} de ${money(goal)} (${pct}%)</p>
        <label>Meta mensal (R$)</label><input id="meta" inputmode="decimal" value="${state.plan.month||""}">
        <label>Meta diária (R$)</label><input id="metad" inputmode="decimal" value="${state.plan.day||""}">
        <button id="savem" style="margin-top:8px;width:100%">Salvar metas</button></section>`;
    } else if(gsub==="cal"){
      body=`<section class="card"><p class="muted">${new Date().toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</p>
        ${md.map(k=>{const sl=totals([k],now); return `<p>${k.slice(8)}/${k.slice(5,7)} · ${sl.net||sl.ms?money(sl.net)+" · "+clock(sl.ms):"<span class='muted'>sem registro</span>"}</p>`}).join("")}
      </section>`;
    } else {
      body=`<section class="card"><p class="muted">Hoje</p><p>Bruto ${money(t.inc)} · despesas ${money(t.exp)} · líquido ${money(t.net)}</p><p>Tempo ${clock(t.ms)} · km ${(t.km||0).toFixed(1)}</p>
        <p class="muted" style="margin-top:8px">Mês</p><p>Bruto ${money(mt.inc)} · despesas ${money(mt.exp)} · líquido ${money(mt.net)}</p></section>`;
    }
    $("view").innerHTML=`<div class="tabs">${subs.map(([id,label])=>`<button class="${gsub===id?"on":""}" data-gsub="${id}">${label}</button>`).join("")}</div>${body}`;
    $("view").querySelectorAll("[data-gsub]").forEach(b=>b.onclick=()=>{gsub=b.dataset.gsub; state.gsub=gsub; save()});
    if($("kin")) $("kin").onclick=()=>{state._formKind="in"; renderDayForm();};
    if($("kout")) $("kout").onclick=()=>{state._formKind="out"; renderDayForm();};
    if($("add")) $("add").onclick=()=>{
      const cents=Math.round(Number(($("val").value||"").replace(",","."))*100); if(!cents) return;
      const label=$("cat").value; const out=CATS.includes(label);
      state.entries.push({id:String(Date.now()),kind:out?"out":"in",cents,day,cat:out?label:"Corrida",app:out?"":label,note:""});
      save();
    };
    if($("savem")) $("savem").onclick=()=>{ state.plan.month=Number(String($("meta").value).replace(",","."))||0; state.plan.day=Number(String($("metad").value).replace(",","."))||0; save(); };
    if($("list")) $("list").innerHTML=state.entries.filter(e=>e.day===day).map(e=>`<p>${e.kind==="in"?(e.app||"Receita"):e.cat} ${money(e.cents)}</p>`).join("")||"<p class='muted'>Nada lançado hoje.</p>";
  } else if(tab==="radio"){
    $("view").innerHTML=`<section class="card"><p class="muted">Rádio</p><p>Mapa e voz ao vivo em breve.</p></section>`;
  } else if(tab==="comunidade"){
    $("view").innerHTML=`<section class="card"><p class="muted">Comunidade</p><p>Parceiros próximos em breve.</p></section>`;
  }
  if(tab!=="inicio") return;
  function renderDayForm(){
    const box=$("formbox"); if(!box) return;
    const k=state.editDay||dayKey(new Date());
    const kind=state._formKind||"in";
    const cats=kind==="in"?allEarnCats():allSpendCats();
    box.innerHTML=`<label>Valor (R$)</label><input id="val" inputmode="decimal" placeholder="0,00">
      <label>Categoria</label><select id="cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select>
      <label>Nova categoria (opcional)</label><input id="newcat" placeholder="Ex: frete, aluguel">
      <button id="ok" style="margin-top:8px;width:100%">Salvar</button>`;
    $("ok").onclick=()=>{
      const v=Math.round(parseFloat(String($("val").value).replace(",","."))*100);
      if(!v||v<=0){alert("Informe um valor válido");return}
      let cat=$("cat").value;
      const neu=($("newcat").value||"").trim();
      if(neu && addCustomCat(kind==="in"?"earn":"spend",neu)) cat=neu;
      state.entries.push({id:String(Date.now()),kind,cents:v,day:k,cat,app:kind==="in"?cat:"",note:""});
      save();
    };
  }
  const cal=$("calbox");
  if(cal){
    const md=monthDays(now); const first=new Date(now); first.setDate(1); const pad=(first.getDay()+6)%7;
    const cells=Array.from({length:pad},()=>"<span></span>").concat(md.map(k=>{
      const sl=totals([k],now); const has=sl.inc||sl.exp||sl.ms;
      return `<button type="button" class="${has?"has":""}" data-day="${k}">${Number(k.slice(8))}</button>`;
    })).join("");
    cal.innerHTML=`<p class="muted">Calendário</p><div class="cal">${cells}</div><p class="muted" id="dayinfo">Toque um dia com a barrinha.</p><div id="formbox"></div>`;
    cal.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.day;
      state.editDay=k; state._formKind="in";
      renderDayForm();
    });
  }
  if($("send")){
    const box=$("chat");
    (state.chat||[]).slice(-6).forEach(m=>{const p=document.createElement("p"); p.className="msg"; p.textContent=m.text; box.appendChild(p)});
    function push(role,text,voice){ state.chat.push({role,text}); if(state.chat.length>40) state.chat=state.chat.slice(-40); persist();
      if(voice && window.LunaNative && LunaNative.speak) LunaNative.speak(text);
      const p=document.createElement("p"); p.className="msg"; p.textContent=text; box.appendChild(p); box.scrollTop=box.scrollHeight;
    }
    $("send").onclick=()=>{
      const q=$("q"); const text=(q.value||"").trim(); if(!text) return; q.value="";
      push("user",text,false);
      const reply=intent(text,Date.now());
      push("luna",reply||"Não entendi. Tente: iniciar, pausar, 20 reais de combustível.",true);
    };
    $("mic").onclick=()=>{
      if(window.LunaNative && LunaNative.listen) LunaNative.listen();
      else alert("Microfone indisponível neste aparelho.");
    };
  }
  if($("gear")) $("gear").onclick=()=>setTab("config");
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>doAct(b.dataset.act));
  if(window.LunaNative && LunaNative.bubble){
    try{ LunaNative.bubble(); }catch(e){ alert("Não foi possível abrir a bolha.") }
  }
}
render();
setInterval(()=>{ if(tab==="inicio"||(tab==="config"&&gsub==="jornada")) render(); },1000);
fetch("https://raw.githubusercontent.com/zh262hzn7y-gif/luna-neural-space/main/android/app/src/main/assets/www/index.html")
  .then(r=>r.text()).then(html=>{
    const m=html.match(/const BUILD=(\d+)/);
    if(m && Number(m[1])>BUILD && html.includes("Rota dos Parceiros")){ document.open(); document.write(html); document.close(); }
  }).catch(()=>{});
</script>
</body>
