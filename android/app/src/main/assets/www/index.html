<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Luna Neural Space</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07060E;color:#F3F0FF;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:16px 12px 80px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,#49E0FF,#8D6BFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:11px;color:#49E0FF;background:rgba(73,224,255,.12);padding:4px 10px;border-radius:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:rgba(141,107,255,.07);border:1px solid rgba(73,224,255,.15);border-radius:16px;padding:16px}
.card.full{grid-column:1/-1}
.card h3{font-size:12px;color:#49E0FF;font-weight:500;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:24px;font-weight:700}
.card .sub{font-size:12px;color:#888;margin-top:2px}
.progress{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:8px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#8D6BFF,#49E0FF);border-radius:3px}
.apps{display:flex;gap:8px;margin-top:10px}
.app-pill{flex:1;text-align:center;font-size:11px;padding:6px;border-radius:8px;background:rgba(255,255,255,.04)}
.app-pill strong{display:block;font-size:14px;color:#3EE0A0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:8px;background:rgba(255,255,255,.03)}
.cal-day.today{background:rgba(141,107,255,.3);color:#fff;font-weight:700}
.cal-day.has{background:rgba(62,224,160,.2);color:#3EE0A0}
.chat-box{max-height:140px;overflow-y:auto;font-size:13px;line-height:1.5;margin-top:8px}
.chat-box .msg{margin-bottom:6px}
.chat-box .msg.user{text-align:right;color:#49E0FF}
.input-row{display:flex;gap:8px;margin-top:10px}
.input-row input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(73,224,255,.2);border-radius:10px;padding:10px 12px;color:#F3F0FF;font-size:14px;outline:none}
.input-row button{background:linear-gradient(135deg,#8D6BFF,#49E0FF);color:#07060E;border:none;border-radius:10px;padding:0 16px;font-weight:600;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,6,14,.95);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:10px 0 18px;border-top:1px solid rgba(73,224,255,.1)}
.nav button{background:none;border:none;color:#888;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.active{color:#49E0FF}
.nav button svg{width:22px;height:22px}
.bolha{position:fixed;bottom:90px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#8D6BFF,#49E0FF);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(141,107,255,.4);z-index:100;font-size:24px}
.status-ok{color:#3EE0A0;font-size:11px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Luna</div>
  <div class="badge" id="platform">android</div>
</div>

<div class="grid">
  <div class="card">
    <h3>Meta do Mês</h3>
    <div class="val" id="metaVal">R$ 0</div>
    <div class="sub" id="metaSub">0% • falta R$ 0</div>
    <div class="progress"><span id="metaBar" style="width:0%"></span></div>
  </div>
  <div class="card">
    <h3>Hoje</h3>
    <div class="val" id="hojeVal">R$ 0</div>
    <div class="sub" id="hojeSub">0 corridas</div>
  </div>
  <div class="card full">
    <h3>Ganhos por App</h3>
    <div class="apps">
      <div class="app-pill"><strong id="g99">R$0</strong>99</div>
      <div class="app-pill"><strong id="gUber">R$0</strong>Uber</div>
      <div class="app-pill"><strong id="gIn">R$0</strong>InDrive</div>
    </div>
  </div>
  <div class="card full">
    <h3>Calendário • Outubro</h3>
    <div class="calendar" id="cal"></div>
  </div>
  <div class="card full">
    <h3>Chat Luna</h3>
    <div class="chat-box" id="chat">
      <div class="msg">Olá! Sou a Luna. Como posso ajudar no turno?</div>
    </div>
    <div class="input-row">
      <input id="chatInput" placeholder="Fale com a Luna..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Enviar</button>
    </div>
  </div>
</div>

<div class="bolha" onclick="speak('Luna pronta')">🌙</div>

<div class="nav">
  <button class="active" onclick="show('home')">⌂<br>Home</button>
  <button onclick="show('ganhos')">$</button>
  <button onclick="show('cal')">📅</button>
  <button onclick="show('chat')">💬</button>
</div>

<div style="text-align:center;margin-top:20px;font-size:11px;color:#555">
  <span class="status-ok" id="status">Plataforma: android ✓</span> • v4.6 Full
</div>

<script>
const meta = 8000, feito = 2340, hoje = 186, corridas = 7;
function init() {
  document.getElementById('metaVal').textContent = 'R$ ' + feito.toLocaleString('pt-BR');
  const pct = Math.round(feito / meta * 100);
  document.getElementById('metaSub').textContent = pct + '% • falta R$ ' + (meta - feito).toLocaleString('pt-BR');
  document.getElementById('metaBar').style.width = pct + '%';
  document.getElementById('hojeVal').textContent = 'R$ ' + hoje;
  document.getElementById('hojeSub').textContent = corridas + ' corridas';
  document.getElementById('g99').textContent = 'R$ 98';
  document.getElementById('gUber').textContent = 'R$ 62';
  document.getElementById('gIn').textContent = 'R$ 26';
  buildCal();
  if (window.LunaNative) {
    try {
      const p = LunaNative.getPlatform();
      document.getElementById('platform').textContent = p;
      document.getElementById('status').textContent = 'Plataforma: ' + p + ' ✓';
    } catch(e) {}
  }
}
function buildCal() {
  const el = document.getElementById('cal');
  const today = 13;
  for (let i = 1; i <= 31; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day';
    d.textContent = i;
    if (i === today) d.classList.add('today');
    if ([2,5,8,11,12].includes(i)) d.classList.add('has');
    el.appendChild(d);
  }
}
function sendChat() {
  const inp = document.getElementById('chatInput');
  const t = inp.value.trim();
  if (!t) return;
  const box = document.getElementById('chat');
  box.innerHTML += '<div class="msg user">' + t + '</div>';
  box.innerHTML += '<div class="msg">Anotado! Continue focado na meta. Você está a ' + Math.round((8000-2340)/8000*100) + '% do caminho.</div>';
  box.scrollTop = box.scrollHeight;
  inp.value = '';
  if (window.LunaNative && window.LunaNative.speak) {
    try { LunaNative.speak('Anotado'); } catch(e) {}
  }
}
function speak(t) {
  if (window.LunaNative && window.LunaNative.speak) {
    try { LunaNative.speak(t); } catch(e) {}
  }
}
function show(tab) { /* navegação simples */ }
window.onload = init;
</script>
</body>
</html>
