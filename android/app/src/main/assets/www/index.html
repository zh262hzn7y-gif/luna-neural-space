<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota dos Parceiros</title>
<style>
:root{--bg:#07060e;--card:#16122b;--line:#34295a;--fg:#f3f0ff;--muted:#b3a8d6;--v:#8d6bff;--c:#49e0ff;--e:#3ee0a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(500px 220px at 0% 0%,rgba(141,107,255,.35),transparent 70%),var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;justify-content:space-between;gap:12px;padding:16px 16px 8px}
h1{font-size:22px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.clock{font-size:40px;font-weight:800;letter-spacing:-1px;margin:6px 0}
main{flex:1;overflow:auto;padding:0 16px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input,select{font:inherit;color:inherit}
button{min-height:44px;border:0;border-radius:12px;background:var(--v);color:#f7f4ff;font-weight:700}
.ghost{background:#221b3d;color:var(--fg)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#0c1020;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:transparent;color:var(--muted);border-radius:0;font-size:11px;min-height:58px}
.nav button.on{color:var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
input,select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#0c1020;padding:0 10px}
.msg{background:#221b3d;border-radius:14px;padding:8px 10px;margin:6px 0;font-size:14px}
.msg.me{background:var(--v)}
.orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9f6ff,#8d6bff 55%,#1a1033);box-shadow:0 0 0 6px rgba(141,107,255,.25)}
.hide{display:none}
@media(min-width:900px){
  body{flex-direction:row}
  .nav{flex-direction:column;width:120px;border-top:0;border-right:1px solid var(--line)}
  main{padding-top:16px}
  .grid.wide{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<header>
  <div>
    <p class="muted" id="hello">Rota dos Parceiros</p>
    <h1 id="who">Motorista</h1>
    <p class="muted" id="sub">Gestão neste aparelho</p>
  </div>
  <button class="ghost" id="gear" style="width:44px">⚙</button>
</header>
<main id="view"></main>
<nav class="nav" id="nav"></nav>
<script>
const KEY="rota_apk_v6";
const CATS=["Combustível","Alimentação","Pedágio","Estacionamento","Manutenção","Lavagem","Seguro","Outros"];
const APPS=["Uber","99","inDrive","Particular","Outros"];
const $=id=>document.getElementById(id);
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function money(c){return (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function clock(ms){const s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")}
function hm(ts){return new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function empty(){return {name:"",tab:"inicio",shifts:[],entries:[],plan:{day:0,month:0,basis:"liquido"},track:false,chat:[{role:"luna",text:"Pode escrever ou usar o microfone. Texto não sai em voz, a menos que você peça."}]}}
let state; try{state=JSON.parse(localStorage.getItem(KEY))||empty()}catch(e){state=empty()}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function save(){persist(); render()}
function active(){return state.shifts.find(s=>s.state==="working"||s.state==="paused"||s.state==="coffee")}
function worked(s,now){if(s.state==="working"&&s.segment){const x=now-s.segment; if(x>0&&x<2*3600e3) return s.worked+x} return s.worked}
function catchUp(now){
  const s=active(); if(!s||s.state!=="working") return;
  const d=now-s.seen;
  if(d<0||d>2*3600e3){s.state="paused"; s.segment=null; s.note="Intervalo longo ou relógio alterado. Não somei essas horas."; s.seen=now; return}
  s.worked+=d; s.segment=now; s.seen=now;
}
function start(now){
  if(active()) return "Já existe turno aberto. Use retomar.";
  const day=dayKey(new Date(now));
  const n=state.shifts.filter(s=>s.day===day).length+1;
  if(n>4) return "Os quatro turnos de hoje já foram usados.";
  state.shifts.push({id:String(now),day,slot:n,state:"working",started:now,ended:null,worked:0,segment:now,seen:now,pauses:[],coffee:[],km:0,note:""});
  return "Turno "+n+" iniciado às "+hm(now)+".";
}
function pause(now){const s=active(); if(!s) return "Nenhum turno aberto."; if(s.state!=="working") return "O turno já está parado."; const x=now-s.segment; if(x>0&&x<2*3600e3) s.worked+=x; s.segment=null; s.state="paused"; s.pauses.push([now,null]); s.seen=now; return "Pausa registrada."}
function cafe(now){const s=active(); if(!s) return "Abra um turno antes do café."; if(s.state==="working"){const x=now-s.segment; if(x>0&&x<2*3600e3) s.worked+=x; s.segment=null} s.state="coffee"; s.coffee.push([now,null]); s.seen=now; return "Café separado da pausa."}
function resume(now){const s=active(); if(!s) return "Nada para retomar."; if(s.state==="working") return "Já está trabalhando."; const list=s.state==="coffee"?s.coffee:s.pauses; const last=list[list.length-1]; if(last&&!last[1]) last[1]=now; s.state="working"; s.segment=now; s.seen=now; return "Retomado. O início continua "+hm(s.started)+"."}
function closeShift(now){const s=active(); if(!s) return "Nenhum turno aberto."; if(s.state==="working"){const x=now-s.segment; if(x>0&&x<2*3600e3) s.worked+=x} s.segment=null; s.state="closed"; s.ended=now; s.seen=now; return "Turno "+s.slot+" fechado. Trabalhado "+clock(s.worked)+"."}
function totals(days,now){
  const inc=state.entries.filter(e=>e.kind==="in"&&days.includes(e.day)).reduce((a,e)=>a+e.cents,0);
  const exp=state.entries.filter(e=>e.kind==="out"&&days.includes(e.day)).reduce((a,e)=>a+e.cents,0);
  const shifts=state.shifts.filter(s=>days.includes(s.day));
  const ms=shifts.reduce((a,s)=>a+worked(s,now),0);
  const km=shifts.reduce((a,s)=>a+(s.km||0),0);
  const h=ms/36e5;
  return {inc,exp,net:inc-exp,ms,km,ph:h>=1/60?Math.round(inc/h):null};
}
function intent(text,now){
  const n=text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/iniciar/.test(n)) return start(now);
  if(/pausar|pausa/.test(n)) return pause(now);
  if(/cafe/.test(n)) return cafe(now);
  if(/retomar|continuar/.test(n)) return resume(now);
  if(/fechar/.test(n)) return closeShift(now);
  if(/quanto tempo|trabalhei/.test(n)){const t=totals([dayKey(new Date(now))],now); return "Hoje: "+clock(t.ms)+" trabalhadas."}
  if(/quanto ganhei|lucro|resultado/.test(n)){const t=totals([dayKey(new Date(now))],now); return "Hoje bruto "+money(t.inc)+", despesas "+money(t.exp)+", líquido "+money(t.net)+"."}
  const m=n.match(/(\d+[.,]?\d*)/);
  if(/registre|anota|lanca/.test(n)){
    if(!m) return "Diga o valor em reais e a categoria.";
    const cents=Math.round(Number(m[1].replace(",","."))*100);
    const cat=CATS.find(c=>n.includes(c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").slice(0,6))) || (n.includes("combust")?"Combustível":null);
    const app=APPS.find(a=>n.includes(a.toLowerCase()));
    if(!cat && !app) return "Falta a categoria ou o aplicativo. Exemplo: 20 reais de combustível.";
    state.entries.push({id:String(now),kind:cat?"out":"in",cents,day:dayKey(new Date(now)),cat:cat||"Corrida",app:app||"",note:"Luna"});
    return "Lancei "+money(cents)+(cat?" em "+cat:" na "+app)+".";
  }
  return "";
}
let tab=state.tab||"inicio";
function setTab(t){tab=t; state.tab=t; save()}
const NAV=[["inicio","Início"],["gestao","Gestão"],["mapa","Mapa"],["fala","Comunica"],["luna","Luna"]];
function render(){
  const now=Date.now(); catchUp(now);
  const h=new Date().getHours();
  $("hello").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite");
  $("who").textContent=state.name||"Motorista";
  const open=active();
  $("sub").textContent=open?("Turno "+open.slot+" · "+open.state):"Nenhum turno aberto";
  $("nav").innerHTML=NAV.map(([id,label])=>`<button class="${tab===id?"on":""}" data-tab="${id}">${label}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  const day=dayKey(new Date());
  const t=totals([day],now);
  if(tab==="inicio"){
    $("view").innerHTML=`
      <section class="card"><p class="muted">Jornada</p><div class="clock">${open?clock(worked(open,now)):clock(t.ms)}</div>
      <p class="muted">${open?"Início "+hm(open.started)+(open.note?" · "+open.note:""):"Toque em Gestão para iniciar o turno 1."}</p>
      <div class="row" style="margin-top:10px"><button id="goj">Abrir turno</button></div></section>
      <div class="grid wide">
        <div class="card"><p class="muted">Bruto</p><b>${money(t.inc)}</b></div>
        <div class="card"><p class="muted">Despesas</p><b>${money(t.exp)}</b></div>
        <div class="card"><p class="muted">Líquido</p><b>${money(t.net)}</b></div>
        <div class="card"><p class="muted">Por hora</p><b>${t.ph==null?"Sem dados":money(t.ph)}</b></div>
      </div>
      <section class="card" id="clima"><p class="muted">Clima · Governador Valadares</p><p>Consultando Open-Meteo…</p></section>
      <section class="card"><p class="muted">Notícias</p><p class="muted">Sem alerta inventado.</p>
        <p><a href="https://www.driododoce.com.br/" style="color:var(--c)">Diário do Rio Doce</a></p>
        <p><a href="https://news.google.com/search?q=BR-381+Governador+Valadares&hl=pt-BR&gl=BR&ceid=BR:pt-419" style="color:var(--c)">BR-381 nas fontes</a></p>
      </section>`;
    $("goj").onclick=()=>setTab("gestao");
    fetch("https://api.open-meteo.com/v1/forecast?latitude=-18.851&longitude=-41.949&current=temperature_2m,weather_code&timezone=America/Sao_Paulo")
      .then(r=>r.json()).then(b=>{
        const box=$("clima"); if(!box) return;
        const temp=b.current&&typeof b.current.temperature_2m==="number"?Math.round(b.current.temperature_2m)+"°C":"—";
        box.innerHTML=`<p class="muted">Clima · Open-Meteo</p><b>${temp}</b><p class="muted">${(b.current&&b.current.time||"").replace("T"," ")}</p>`;
      }).catch(()=>{$("clima")&&($("clima").innerHTML="<p class='muted'>Clima indisponível agora.</p>")});
  } else if(tab==="gestao"){
    $("view").innerHTML=`<section class="card"><p class="muted">${open?"Turno "+open.slot:"Sem turno"}</p><div class="clock">${open?clock(worked(open,now)):"00:00:00"}</div>
      <div class="row">
        ${!open?'<button id="b1">Iniciar</button>':""}
        ${open&&open.state==="working"?'<button class="ghost" id="b2">Pausar</button>':""}
        ${open&&open.state!=="coffee"?'<button class="ghost" id="b3">Café</button>':""}
        ${open&&open.state!=="working"?'<button id="b4">Retomar</button>':""}
        ${open?'<button class="ghost" id="b5">Fechar</button>':""}
      </div><p class="muted" id="note"></p></section>
      <section class="card"><p class="muted">Lançamento de hoje</p>
        <div class="row"><button id="kin" class="ghost">Receita</button><button id="kout" class="ghost">Despesa</button></div>
        <label>Valor</label><input id="val" inputmode="decimal" placeholder="0,00">
        <label>Categoria ou app</label><select id="cat">${APPS.map(a=>`<option>${a}</option>`).join("")}${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
        <button id="add" style="margin-top:8px;width:100%">Lançar</button>
        <div id="list"></div>
      </section>
      <section class="card"><p class="muted">Meta do mês (R$)</p><input id="meta" inputmode="decimal" value="${state.plan.month||0}"><button id="savem" style="margin-top:8px">Salvar meta</button>
      <p class="muted">Km manual do turno aberto</p><input id="km" inputmode="decimal" placeholder="km"><button id="savek">Corrigir km</button></section>`;
    const act=(fn)=>{ $("note").textContent=fn(Date.now()); save() };
    $("b1")&&($("b1").onclick=()=>act(start));
    $("b2")&&($("b2").onclick=()=>act(pause));
    $("b3")&&($("b3").onclick=()=>act(cafe));
    $("b4")&&($("b4").onclick=()=>act(resume));
    $("b5")&&($("b5").onclick=()=>{ if(confirm("Fechar o turno?")) act(closeShift) });
    $("add").onclick=()=>{
      const cents=Math.round(Number($("val").value.replace(",","."))*100); if(!cents) return;
      const label=$("cat").value; const out=CATS.includes(label);
      state.entries.push({id:String(Date.now()),kind:out?"out":"in",cents,day,cat:out?label:"Corrida",app:out?"":label,note:""});
      save();
    };
    $("savem").onclick=()=>{ state.plan.month=Number($("meta").value.replace(",","."))||0; save() };
    $("savek").onclick=()=>{ const s=active(); if(!s) return; s.km=Number($("km").value.replace(",","."))||0; s.note=(s.note?s.note+" · ":"")+"km editado"; save() };
    $("list").innerHTML=state.entries.filter(e=>e.day===day).map(e=>`<p>${e.kind==="in"?"Receita":e.cat} ${money(e.cents)}</p>`).join("")||"<p class='muted'>Nada lançado hoje.</p>";
  } else if(tab==="mapa"){
    $("view").innerHTML=`<section class="card"><p>Sua posição, se o GPS permitir. Nenhum motorista inventado aparece aqui.</p>
      <button id="gps">Mostrar meu ponto</button><p class="muted" id="gstat">O mapa dos parceiros entre aparelhos continua na versão com conta. Este APK não publica sua placa.</p>
      <div id="frame"></div></section>`;
    $("gps").onclick=()=>{
      const put=(lat,lng)=>{
        const d=0.02; const src=`https://www.openstreetmap.org/export/embed.html?bbox=${lng-d}%2C${lat-d}%2C${lng+d}%2C${lat+d}&layer=mapnik&marker=${lat}%2C${lng}`;
        $("frame").innerHTML=`<iframe title="Mapa" src="${src}" style="width:100%;height:280px;border:0;border-radius:12px;margin-top:8px"></iframe>`;
        $("gstat").textContent=`${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      };
      if(window.LunaNative&&LunaNative.getLocation){ LunaNative.getLocation("window.__geo"); window.__geo=(a,b)=>put(a,b); return }
      if(!navigator.geolocation){ $("gstat").textContent="GPS indisponível."; return }
      navigator.geolocation.getCurrentPosition(p=>put(p.coords.latitude,p.coords.longitude),()=>$("gstat").textContent="Permissão de localização negada.");
    };
  } else if(tab==="fala"){
    $("view").innerHTML=`<section class="card"><h2 style="margin:0 0 8px;font-size:18px">Rádio e chamada</h2>
      <p>Este APK não transmite áudio entre dois aparelhos. Não há servidor de mídia configurado. Segurar um botão aqui não finge uma transmissão.</p>
      <p class="muted">O rádio e a chamada ao vivo estão na versão com conta, quando dois motoristas estão online.</p></section>
      <section class="card"><p class="muted">Recado só neste aparelho</p><input id="note" placeholder="Anotação"><button id="nsave">Guardar</button><div id="notes"></div></section>`;
    const notes=JSON.parse(localStorage.getItem("rota_notes")||"[]");
    $("notes").innerHTML=notes.map(n=>`<p class="msg">${n}</p>`).join("");
    $("nsave").onclick=()=>{ if(!$("note").value.trim()) return; notes.push($("note").value.trim()); localStorage.setItem("rota_notes",JSON.stringify(notes)); render() };
  } else {
    $("view").innerHTML=`<section class="card" style="display:flex;gap:10px;align-items:center"><div class="orb"></div><div><b>Luna</b><p class="muted" id="phase">Em espera</p></div></section>
      <div id="chat"></div>
      <div class="row"><input id="q" placeholder="Pergunte ou peça um lançamento"><button id="mic">Falar</button><button id="send">Enviar</button></div>
      <p class="muted">Bolha sobre outros apps pede permissão de sobreposição.</p>
      <button class="ghost" id="bubble">Mostrar bolha</button>`;
    const box=$("chat");
    state.chat.slice(-12).forEach(m=>{const p=document.createElement("p"); p.className="msg"+(m.role==="user"?" me":""); p.textContent=m.text; box.appendChild(p)});
    function push(role,text,voice){ state.chat.push({role,text}); if(state.chat.length>40) state.chat=state.chat.slice(-40); save();
      if(voice && window.LunaNative && LunaNative.speak) LunaNative.speak(text);
      else if(voice && window.speechSynthesis){ const u=new SpeechSynthesisUtterance(text); u.lang="pt-BR"; speechSynthesis.cancel(); speechSynthesis.speak(u) }
    }
    async function ask(text,voice){
      const local=intent(text,Date.now());
      state.chat.push({role:"user",text});
      if(local){ push("luna",local,voice); return }
      if(window.LunaNative && LunaNative.geminiQuery){
        $("phase").textContent="Processando";
        const ans=LunaNative.geminiQuery("Responda em português, curto, sem inventar clima ou notícia. Contexto do motorista: "+JSON.stringify({hoje:totals([dayKey(new Date())],Date.now())})+". Pergunta: "+text);
        if(ans==="__NO_KEY__") push("luna","Sem chave de IA neste aparelho. Comandos de turno e lançamento funcionam mesmo assim. A chave fica em Ajustes.",voice);
        else if(!ans||ans==="__API_ERROR__") push("luna","A consulta falhou. Os dados da jornada continuam salvos.",false);
        else push("luna",ans,voice);
        return;
      }
      push("luna","Não reconheci o comando. Tente: iniciar o turno, pausar, registrar 20 reais de combustível.",voice);
    }
    $("send").onclick=()=>{ const v=$("q").value.trim(); if(!v) return; $("q").value=""; ask(v,false) };
    $("mic").onclick=()=>{
      if(window.LunaNative&&LunaNative.startListening){
        $("phase").textContent="Ouvindo";
        window.onLunaSpeechResult=function(res){
          if(!res||String(res).startsWith("__")) { if(res==="__UNAVAILABLE__"||String(res).startsWith("__ERROR__")) $("phase").textContent="Erro de microfone"; return }
          if(res==="__LISTENING__"||res==="__SPEAKING__"||String(res).startsWith("__RMS__")||String(res).startsWith("__PARTIAL__")) return;
          $("phase").textContent="Em espera";
          ask(String(res),true);
        };
        LunaNative.startListening();
        return;
      }
      $("phase").textContent="Microfone indisponível neste modo";
    };
    $("bubble").onclick=()=>{ try{ if(window.LunaNative&&LunaNative.showOverlay) LunaNative.showOverlay(); else alert("A bolha abre no Android com permissão de sobreposição. Aqui a Luna já está nesta tela.") }catch(e){ alert("Não foi possível abrir a bolha.") } };
  }
}
$("gear").onclick=()=>{
  const name=prompt("Seu nome no painel", state.name||"");
  if(name!=null) state.name=name.trim().slice(0,40);
  const key=prompt("Chave Gemini (opcional, fica só no aparelho). Deixe vazio para manter.", "");
  if(key && window.LunaNative && LunaNative.saveKey) LunaNative.saveKey(key.trim());
  save();
};
setInterval(()=>{
  const s=active();
  if(!s||s.state!=="working") return;
  catchUp(Date.now());
  persist();
  const el=document.querySelector(".clock");
  if(el) el.textContent=clock(worked(s,Date.now()));
},1000);
render();
</script>
</body>
</html>
