<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Luna Neural Space</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07060E;
    color: #F3F0FF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #49E0FF, #8D6BFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle { color: #49E0FF; font-size: 14px; margin-bottom: 32px; opacity: 0.8; }
  .card {
    background: rgba(141, 107, 255, 0.08);
    border: 1px solid rgba(73, 224, 255, 0.2);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    backdrop-filter: blur(10px);
  }
  .status { font-size: 16px; margin-bottom: 16px; }
  .btn {
    background: linear-gradient(135deg, #8D6BFF, #49E0FF);
    color: #07060E;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-weight: 600;
    font-size: 16px;
    margin-top: 12px;
    width: 100%;
  }
  .info { margin-top: 24px; font-size: 12px; color: #888; }
</style>
</head>
<body>
  <h1>Luna</h1>
  <div class="subtitle">Neural Space • Motorista</div>
  <div class="card">
    <div class="status" id="status">Carregando...</div>
    <button class="btn" onclick="testBridge()">Testar conexão</button>
  </div>
  <div class="info">Versão 4.5.1 • App abre com sucesso</div>
<script>
  function setStatus(msg) { document.getElementById('status').textContent = msg; }
  function testBridge() {
    if (window.LunaNative) {
      try {
        const p = LunaNative.getPlatform();
        setStatus('Plataforma: ' + p + ' ✓');
      } catch(e) {
        setStatus('Erro no bridge: ' + e);
      }
    } else {
      setStatus('LunaNative não encontrado');
    }
  }
  window.onload = function() {
    if (window.LunaNative) {
      setStatus('Pronto • Bridge OK');
    } else {
      setStatus('WebView carregado');
    }
  };
</script>
</body>
</html>
